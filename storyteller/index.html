<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<meta name="description" content="Storyteller: one real story, a room full of liars. Everyone plays on their own phone.">
<title>Storyteller — Game Night</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📜%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
<style>
body.game-storyteller{--bg:#150f24;--bg2:#2b1d3f;--card:#1f1733;--card2:#2a2045;--accent:#f2a65a;--accent-ink:#2a1405}
.term{text-align:center;padding:22px 18px 18px;margin-bottom:14px;border-radius:var(--r);border:1px solid rgba(242,166,90,.35);
  background:radial-gradient(120% 90% at 50% 0%,rgba(242,166,90,.22),transparent 70%),var(--card)}
.term-kind{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.term-t{font-family:Cinzel,Georgia,serif;font-size:32px;font-weight:800;line-height:1.15;margin:6px 0 6px;word-break:break-word}
.term-sub{font-size:13px;color:var(--muted)}
.role-note{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.22);font-size:15px;text-align:left}
.secret{border-radius:16px;padding:16px;margin-bottom:6px}
.secret.real{background:linear-gradient(160deg,rgba(70,198,143,.22),rgba(70,198,143,.08));border:1px solid rgba(70,198,143,.5)}
.secret.fake{background:linear-gradient(160deg,rgba(242,166,90,.22),rgba(242,166,90,.06));border:1px solid rgba(242,166,90,.45)}
.secret.compact{margin-top:12px;text-align:left}
.secret-h{font-weight:800;font-size:17px;margin-bottom:6px}
.secret-d{font-size:16px;line-height:1.5}
.secret .small{margin-top:8px;color:var(--muted)}
.prow.now .pn{color:var(--accent)}
.num{width:24px;height:24px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sc{font-weight:800;font-size:18px;min-width:28px;text-align:right}
.plus{font-size:12px;font-weight:800;color:var(--ok);background:rgba(70,198,143,.15);padding:2px 8px;border-radius:99px}
.big-emoji{font-size:46px;line-height:1.2}
.turn h2{margin-top:4px}
.targets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.target{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:17px}
.target.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.target:disabled{opacity:.6}
.tname{flex:1}
.reveal-box{text-align:center;padding:22px 16px;border-radius:var(--r);margin-bottom:14px;border:1px solid var(--line)}
.reveal-box.right{background:linear-gradient(160deg,rgba(70,198,143,.25),rgba(70,198,143,.06))}
.reveal-box.wrong{background:linear-gradient(160deg,rgba(224,82,82,.25),rgba(224,82,82,.06))}
.rv-line{font-size:14px;color:var(--muted);margin-top:8px}
.rv-big{font-family:Cinzel,Georgia,serif;font-size:24px;font-weight:800;margin:6px 0}
.rv-pts{font-weight:700;color:var(--accent)}
.rv-card{margin-top:14px;padding:14px;border-radius:14px;background:rgba(0,0,0,.25);text-align:left;font-size:15px;line-height:1.5}
.badge{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.win{text-align:center;padding:30px 18px;border-radius:var(--r);margin-bottom:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(242,166,90,.3),rgba(160,131,255,.18))}
.win h1{margin:8px 0}
.win p{color:var(--muted)}
.hrow{padding:9px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.h-t{font-weight:600}
.h-real{font-weight:400;color:var(--muted);font-size:13px}
</style>
</head>
<body class="dusk game-storyteller">
<div id="app"><div class="wrap"><div class="loading"><p>Loading…</p></div></div></div>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="/storyteller/game.js"></script>
</body>
</html>
