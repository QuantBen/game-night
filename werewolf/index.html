<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1124">
<meta name="description" content="Werewolf, narrated. Everyone plays on their own phone; one device speaks the commands.">
<title>Werewolf — Game Night</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐺%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
<style>
:root{--wolf:#e05252;--seer:#a083ff;--doctor:#3ec28f;--villager:#e0a84a}
.me{margin-left:auto;font-size:13px;color:var(--muted);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big-name{font-family:Cinzel,Georgia,serif;font-size:22px;font-weight:800}
.steps{list-style:none;counter-reset:s;margin-top:4px}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 34px;color:var(--muted);font-size:15px}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text)}

/* room share */
.share-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.code{font-family:Cinzel,Georgia,serif;font-size:44px;font-weight:800;letter-spacing:.14em;line-height:1.05}
.qr{background:#fff;border-radius:12px;padding:8px;width:132px;height:132px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.link-text{word-break:break-all;margin-top:6px}

/* players */
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .pn{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pr{font-size:13px;color:var(--muted)}
.prow .pm{font-size:12px;color:var(--muted)}
.prow .pi{font-size:20px;width:26px;text-align:center}
.prow.dead .pn{text-decoration:line-through;color:var(--muted)}
.prow .ps{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.prow .ps.alive{color:var(--ok)}
.prow .ps.dead{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted);opacity:.5}
.dot.on{background:var(--ok);opacity:1;box-shadow:0 0 0 3px rgba(70,198,143,.18)}

/* settings */
.opt{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:28px;text-align:center;font-size:18px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-weight:700}
.switch{width:52px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(22px);background:var(--accent-ink)}

.narr{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.narr-ico{flex:none}

/* face-down cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:12px;margin:14px 0}
.fcard{aspect-ratio:5/7;border-radius:12px;position:relative;overflow:hidden;border:1px solid rgba(233,196,106,.35);
  background:
    radial-gradient(circle at 50% 50%,rgba(233,196,106,.25) 0 14px,transparent 15px),
    repeating-linear-gradient(45deg,rgba(233,196,106,.09) 0 6px,transparent 6px 12px),
    repeating-linear-gradient(-45deg,rgba(233,196,106,.09) 0 6px,transparent 6px 12px),
    linear-gradient(160deg,#2b2160,#151236);
  box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s ease}
.fcard::after{content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid rgba(233,196,106,.25)}
.fcard:not(:disabled):active{transform:scale(.96)}
.fcard:not(:disabled):hover{transform:translateY(-2px)}
.fcard.taken{filter:grayscale(1) brightness(.55)}
.fcard.pending{outline:3px solid var(--accent);animation:pulse 1s ease-in-out infinite}
.fcard .owner{position:absolute;left:6px;right:6px;bottom:10px;font-size:12px;font-weight:600;color:#fff;text-align:center;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* role card */
.rcard{--rc:#888;position:relative;border-radius:22px;padding:26px 20px 22px;text-align:center;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,var(--rc),color-mix(in srgb,var(--rc) 45%,#0b0b18) 70%);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 6px rgba(255,255,255,.06)}
.rcard.flip-in{animation:flipIn .7s cubic-bezier(.2,.8,.2,1)}
.rc-title{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.rc-ico{font-size:64px;line-height:1.1;margin:4px 0}
.rc-name{font-family:Cinzel,Georgia,serif;font-size:30px;font-weight:800}
.rc-team{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-top:2px}
.rc-desc{margin-top:14px;font-size:15px;line-height:1.5;opacity:.95}
.rc-extra{margin-top:12px;font-size:14px;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;text-align:left}
.rcard.compact{padding:16px 16px 14px}
.rcard.compact .rc-ico{font-size:40px}
.rcard.compact .rc-name{font-size:22px}
.peek-btn{width:100%;padding:14px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-weight:600;margin-bottom:14px;background:var(--card)}
.peek{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}

/* night */
.sleep{text-align:center;padding:40px 10px 20px}
.say-dim{margin-top:22px;font-style:italic;color:var(--muted);font-size:15px}
.action{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.action.wolf{border-color:rgba(224,82,82,.45)}
.action.seer{border-color:rgba(160,131,255,.45)}
.action.doctor{border-color:rgba(62,194,143,.45)}
.act-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.act-ico{font-size:40px}
.targets{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.target{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:17px}
.target.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.target.skip{margin-top:8px;font-weight:500;color:var(--muted);justify-content:center}
.target.skip.sel{color:var(--text)}
.target:disabled{opacity:.4}
.tname{flex:1}
.tnote{font-size:12px;font-weight:500;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(224,82,82,.18);color:#ff9d9d}
body.day .tag{background:rgba(180,83,28,.12);color:#8a3d12}
.reveal{border-radius:18px;padding:24px 16px;text-align:center;margin:6px 0 4px}
.reveal.bad{background:rgba(224,82,82,.14);border:1px solid rgba(224,82,82,.5)}
.reveal.good{background:rgba(70,198,143,.12);border:1px solid rgba(70,198,143,.45)}
.rv-ico{font-size:52px}
.rv-name{font-family:Cinzel,Georgia,serif;font-size:26px;font-weight:800;margin-top:4px}
.rv-txt{font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.hist{margin-top:14px;font-size:14px;color:var(--muted)}
.hist div{padding:3px 0}

/* day */
.news{text-align:center;padding:22px 18px}
.news h2{margin-top:6px}
.big-emoji{font-size:48px;line-height:1.2}
.tally{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.trow.out{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tn{font-weight:700}
.tc{font-weight:800;font-size:18px}
.tv{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.reveal-card{margin:16px 0 8px}
.big-text{font-size:20px;font-weight:700;margin:18px 0}
.win{text-align:center;padding:30px 18px;border-radius:var(--r);margin-bottom:14px;border:1px solid var(--line)}
.win.village{background:linear-gradient(160deg,rgba(224,168,74,.28),rgba(62,194,143,.18))}
.win.wolves{background:linear-gradient(160deg,rgba(224,82,82,.32),rgba(40,10,20,.4))}
.win h1{margin:8px 0}
.win p{color:var(--muted);margin-top:8px}

/* narrator bar */
.hostbar{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.hostbar.resume,.hostbar.warn{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.hostbar.warn{border-color:rgba(240,163,94,.5)}
.hb-top{display:flex;gap:10px;align-items:flex-start}
.hb-mic{font-size:20px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);flex:none}
.hb-mic.on{box-shadow:0 0 0 3px var(--accent);animation:pulse 1.2s ease-in-out infinite}
.hb-txt{flex:1;min-width:0}
.hb-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hb-say{font-size:15px;margin-top:2px}
.hb-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.panel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.seg button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.select{width:100%;font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px}
.rules{flex-basis:100%;font-size:14px;color:var(--muted)}
.rules h4{color:var(--text);margin:12px 0 4px;font-size:14px}
.rules ul{padding-left:18px}
@keyframes flipIn{from{transform:perspective(900px) rotateY(95deg);opacity:.3}to{transform:perspective(900px) rotateY(0);opacity:1}}
</style>
</head>
<body class="dusk">
<div id="app"><div class="wrap"><div class="loading"><p>Loading…</p></div></div></div>
<noscript>This game needs JavaScript.</noscript>
<script type="module">
import { connect, createRoom, normCode, roomInfo, withLocal } from '/shared/realtime.js';

const GAME_ID = 'werewolf';
const PREVIEW = !!window.WW_PREVIEW;   // single-device preview build

/* ================= basics ================= */
const FAST = !!window.WW_FAST;                 // test hook: speeds up all pauses
const T = ms => FAST ? Math.max(60, Math.round(ms / 12)) : ms;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => Date.now();
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function rid(n = 10) {
  const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = '';
  for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length];
  return s;
}
const store = {
  get(k, sess) { try { return (sess ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },
  set(k, v, sess) { try { (sess ? sessionStorage : localStorage).setItem(k, v); } catch (e) {} },
};
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'value') e.value = v;
    else if (k.startsWith('on')) (e.__on || (e.__on = {}))[k.slice(2)] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false || c === '') continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
// One listener per event type; handlers live on the nodes so in-place updates can swap them.
for (const type of ['click', 'input', 'keydown', 'change']) {
  document.addEventListener(type, ev => {
    for (let n = ev.target; n && n !== document; n = n.parentNode) {
      if (n.__on && n.__on[type]) { if (type === 'click' && n.disabled) return; n.__on[type](ev); return; }
    }
  });
}
// Update the live DOM to match a freshly built tree, touching only what changed (taps aren't lost mid-update).
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
  if (a.nodeType !== 1) { a.replaceWith(b); return; }
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  a.__on = b.__on;
  if ((a.tagName === 'INPUT' || a.tagName === 'SELECT') && a !== document.activeElement && a.value !== b.value) a.value = b.value;
  if (b.__html !== undefined) { if (a.__html !== b.__html) { a.innerHTML = b.__html; a.__html = b.__html; } return; }
  const ac = [...a.childNodes], bc = [...b.childNodes];
  for (let i = 0; i < bc.length; i++) { if (i < ac.length) morph(ac[i], bc[i]); else a.appendChild(bc[i]); }
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}
function cleanName(n) {
  return String(n || '').replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202f\u2060-\u206f\ufeff]/g, '')
    .replace(/\s+/g, ' ').trim().slice(0, 18);
}
function listJoin(a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ================= roles ================= */
const ROLES = {
  wolf:     { name: 'Werewolf', icon: '🐺', team: 'wolves', color: '#d94848', desc: 'Each night, wake up with the other werewolves and agree on one person to eliminate. By day, act innocent and steer the vote away from your pack.' },
  seer:     { name: 'Seer',     icon: '🔮', team: 'village', color: '#8f6cf0', desc: 'Each night, choose one player and learn whether they are a werewolf. Use what you know without exposing yourself too early.' },
  doctor:   { name: 'Doctor',   icon: '🩺', team: 'village', color: '#2fae7f', desc: 'Each night, choose one player to protect from the werewolves. You may protect yourself, but not the same person two nights in a row.' },
  villager: { name: 'Villager', icon: '🧑‍🌾', team: 'village', color: '#d29a3a', desc: 'No night power. Listen closely, question everyone, and use your vote to find the werewolves.' },
};
function article(r) { return { wolf: 'a Werewolf', seer: 'the Seer', doctor: 'the Doctor', villager: 'a Villager' }[r] || 'a mystery'; }
// Light obfuscation so roles aren't stored as plain words.
function enc(role, salt) {
  const s = role + '|' + salt; let o = '';
  for (let i = 0; i < s.length; i++) o += String.fromCharCode(s.charCodeAt(i) ^ (salt.charCodeAt(i % salt.length) & 15));
  return btoa(o);
}
function dec(code, salt) {
  try { const s = atob(code); let o = ''; for (let i = 0; i < s.length; i++) o += String.fromCharCode(s.charCodeAt(i) ^ (salt.charCodeAt(i % salt.length) & 15)); return o.split('|')[0]; }
  catch (e) { return null; }
}
function defaultCfg(n) { return { wolves: n <= 5 ? 1 : n <= 8 ? 2 : n <= 12 ? 3 : 4, seer: true, doctor: n >= 5 }; }
function cfgProblems(c, n) {
  const sp = (c.seer ? 1 : 0) + (c.doctor ? 1 : 0);
  if (n < 3) return ['You need at least 3 players (5 or more is more fun).'];
  if (c.wolves < 1) return ['You need at least one werewolf.'];
  if (c.wolves * 2 >= n) return [`Too many werewolves for ${n} players.`];
  if (c.wolves + sp > n) return ['Not enough players for all these roles.'];
  return [];
}
function buildDeck(n, c) {
  const d = [];
  for (let i = 0; i < c.wolves; i++) d.push('wolf');
  if (c.seer) d.push('seer');
  if (c.doctor) d.push('doctor');
  while (d.length < n) d.push('villager');
  return shuffle(d.slice(0, n));
}

/* ================= shared game helpers ================= */
const roleOf = (s, p) => (p && p.role && s.deal) ? dec(p.role, s.deal.id) : null;
const byPid = (s, pid) => (s.players || []).find(p => p.pid === pid);
const nm = (s, pid) => { const p = byPid(s, pid); return p ? p.name : '?'; };
const key = (s, x) => `${s.deal ? s.deal.id : 'x'}-${s.round}-${x}`;
const aliveOf = s => s.players.filter(p => p.alive);
function winner(s) {
  const a = aliveOf(s); const w = a.filter(p => roleOf(s, p) === 'wolf').length;
  if (w === 0) return 'village';
  if (w >= a.length - w) return 'wolves';
  return null;
}

/* ================= identity ================= */
let myPid = store.get('ww_pid', true);
if (!myPid) { myPid = rid(10); store.set('ww_pid', myPid, true); }
let myInput = { pid: myPid };

/* ================= ui state ================= */
const S = {
  nameDraft: store.get('ww_name') || '', codeDraft: '', peekUntil: 0, sel: {}, confirm: null, rules: false,
  hostOpen: true, panel: null, toast: '', flipped: {}, joinAt: 0, busy: false,
};
let QR = null;
import('/shared/vendor/qrcode.js').then(m => { QR = m.default; render(); }).catch(() => {});

/* ================= network ================= */
const Net = {
  mode: 'connecting',          // connecting | ready | unconfigured | error
  B: null, code: null, room: null, // room: loading | ok | missing | error
  connected: false, enteredAt: 0, unsubs: [],
  state: null, gotState: false,
  inputs: {}, online: new Set(), hostOnline: false, hostSeen: 0,
};
const base = () => `rooms/${Net.code}`;

function mergeInput(inp) {
  if (!inp || typeof inp !== 'object' || typeof inp.pid !== 'string' || typeof inp.ts !== 'number') return false;
  const cur = Net.inputs[inp.pid];
  if (cur && cur.ts >= inp.ts) return false;
  Net.inputs[inp.pid] = inp;
  return true;
}
const HIST = [];
function hist(kind, st) { HIST.push(`${kind} v${st.ver} ${st.phase}/${st.step} say=${st.say ? st.say.id : '-'} t=${now() % 100000}`); if (HIST.length > 40) HIST.shift(); }
function acceptState(st) {
  if (!st || typeof st !== 'object' || typeof st.ver !== 'number' || !Array.isArray(st.players)) return;
  const cur = Net.state;
  if (cur && (st.ver < cur.ver || (st.ver === cur.ver && (st.ts || 0) <= (cur.ts || 0)))) return;
  hist('accept', st);
  Net.state = st;
  if (Host.active && st.host !== myPid) Host.stop('Another device is narrating now.');
  render(); hostKick();
}

const writers = {};
function queueWrite(path, data) {
  const w = writers[path] || (writers[path] = { busy: false, next: null, tries: 0 });
  w.next = data;
  if (!w.busy) pump(path);
}
async function pump(path) {
  const w = writers[path]; w.busy = true;
  while (w.next != null) {
    const d = w.next; w.next = null;
    try { await Net.B.set(path, d); w.tries = 0; }
    catch (e) {
      console.warn('write failed', path, e);
      if (w.tries < 4) { w.tries++; await sleep(600 * w.tries); if (w.next == null) w.next = d; continue; }
      w.tries = 0; toast('Couldn’t save. Check your internet connection.');
    }
  }
  w.busy = false;
}
function publishState(s) {
  s.ver = Math.max(s.ver || 0, Net.state ? Net.state.ver : 0) + 1;
  s.ts = now();
  Net.state = s;
  hist('publish', s);
  queueWrite(base() + '/state', JSON.stringify(s));
  render(); hostKick();
}
function saveInputLocal() { store.set('ww_inp', JSON.stringify({ code: Net.code, inp: myInput }), true); }
function sendInput(patch) {
  myInput = Object.assign({}, myInput, patch, { pid: myPid, ts: Math.max(now(), (myInput.ts || 0) + 1) });
  saveInputLocal();
  if (Host.active) { mergeInput(myInput); hostKick(); }
  queueWrite(`${base()}/inputs/${myPid}`, JSON.stringify(myInput));
  updatePresence();
  render();
}
let lastPresence = null;

const BOT_NAMES = ['Ava', 'Bo', 'Cleo', 'Dax', 'Eve', 'Finn', 'Gus', 'Ivy', 'Jo', 'Kit'];
const isBot = pid => typeof pid === 'string' && pid.startsWith('bot-');
const Bots = {
  last: {},
  hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
  delay(pid, salt, min, span) { return T(min + this.hash(pid + salt) % span); },
  pick(list, pid, salt) { return list.length ? list[this.hash(pid + salt) % list.length] : null; },
  add(s, n) {
    const used = new Set(s.players.map(p => p.name.toLowerCase()));
    let added = 0;
    for (const nm0 of BOT_NAMES) {
      if (added >= n) break;
      const name = nm0 + ' 🤖';
      if (used.has(name.toLowerCase())) continue;
      const pid = 'bot-' + rid(6);
      s.players.push({ pid, name, alive: true }); added++;
      this.set(pid, { pid, name, gid: s.gid });
    }
    if (s.cfg.auto) Object.assign(s.cfg, defaultCfg(s.players.length));
  },
  set(pid, inp) {
    const prev = this.last[pid] || {};
    const next = Object.assign({}, prev, inp, { pid });
    if (same(Object.assign({}, prev, { ts: 0 }), Object.assign({}, next, { ts: 0 }))) return false;
    next.ts = Math.max(now(), (prev.ts || 0) + 1);
    this.last[pid] = next; mergeInput(next); return true;
  },
  act(s) {   // decides what every bot does right now; returns true if any bot changed its mind
    let ch = false;
    const el_ = now() - s.stepAt;
    for (const p of s.players) {
      if (!isBot(p.pid)) continue;
      const pid = p.pid; const r = roleOf(s, p);
      const base = { pid, name: p.name, gid: s.gid };
      if (!this.last[pid]) ch = this.set(pid, base) || ch;
      if (s.phase === 'deal' && s.deal) {
        if (p.card == null && el_ > this.delay(pid, 'claim' + s.deal.id, 1200, 3500)) {
          const free = s.deal.owners.map((o, i) => o ? -1 : i).filter(i => i >= 0);
          const c = this.pick(free, pid, 'c' + el_);
          if (c != null) ch = this.set(pid, { claim: { d: s.deal.id, c } }) || ch;
        }
        if (p.card != null && el_ > this.delay(pid, 'rdy' + s.deal.id, 2500, 4000)) ch = this.set(pid, { rdy: s.deal.id }) || ch;
      }
      if (!p.alive) continue;
      const others = s.players.filter(x => x.alive && x.pid !== pid);
      const salt = s.deal ? s.deal.id + s.round + s.phase + s.step : '';
      if (s.phase === 'night' && s.step === r && el_ > this.delay(pid, salt, 2500, 4000)) {
        const k = key(s, r);
        if (r === 'wolf') {
          const pack = s.players.filter(x => x.alive && roleOf(s, x) === 'wolf');
          const human = pack.find(x => !isBot(x.pid) && s.night.picks && s.night.picks[x.pid]);
          const victims = s.players.filter(x => x.alive && roleOf(s, x) !== 'wolf').map(x => x.pid);
          const leader = pack.find(x => isBot(x.pid));
          const t = human ? s.night.picks[human.pid].t : this.pick(victims, leader ? leader.pid : pid, salt);
          if (t) ch = this.set(pid, { act: { k, t, c: true } }) || ch;
        } else if (r === 'seer') {
          const t = this.pick(others.map(x => x.pid), pid, salt);
          if (t) ch = this.set(pid, { act: { k, t, c: true, x: true } }) || ch;
        } else if (r === 'doctor') {
          const opts = s.players.filter(x => x.alive && x.pid !== (s.night && s.night.lastDoc)).map(x => x.pid);
          const t = this.pick(opts, pid, salt);
          if (t) ch = this.set(pid, { act: { k, t, c: true } }) || ch;
        }
      }
      if (s.phase === 'day' && el_ > this.delay(pid, salt, 4000, 6000)) ch = this.set(pid, { vr: key(s, 'vr') }) || ch;
      if (s.phase === 'vote' && el_ > this.delay(pid, salt, 1500, 4500)) {
        const wolf = r === 'wolf';
        const pool = others.filter(x => !(wolf && roleOf(s, x) === 'wolf')).map(x => x.pid);
        const t = this.pick(pool, pid, salt);
        if (t) ch = this.set(pid, { vote: { k: key(s, 'vote'), t } }) || ch;
      }
    }
    return ch;
  },
};
